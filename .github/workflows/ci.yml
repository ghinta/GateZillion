name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install pinned toolchain
        run: scripts/install-tools.sh

      - name: Format, lint, build, type check, test
        run: scripts/check.sh

      - name: Upload place file
        uses: actions/upload-artifact@v4
        with:
          name: GateZillion-place
          path: build/GateZillion.rbxl
          if-no-files-found: error
